name: Tier 1 - L1 software verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    name: ${{ matrix.os }} / Python 3.13
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    env:
      VECLIB_MAXIMUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.10'
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install locked environment
        run: |
          uv sync --locked --extra dev --python-preference only-managed
          .venv/bin/python -c 'import sqlite3; from devbench.engine.scientific_authority import require_patched_wal; require_patched_wal(); print(sqlite3.sqlite_version); assert sqlite3.sqlite_version_info >= (3, 51, 3)'
      - name: Install pinned Codex CLI for marketplace checks
        run: npm install --global @openai/codex@0.147.0
      - name: Check control plane, plugin and verification code
        shell: bash
        run: |
          files=(src/devbench/mcp src/devbench/daemon src/devbench/engine/container_backend.py
            src/devbench/engine/workflow_operations.py integrations/codex/devharness/scripts
            integrations/codex/tests tests/test_mcp_conformance.py tests/test_mcp_resilience_recovery.py
            tests/test_privacy_sentinel_leakage.py tests/test_codex_live_smoke.py
            tests/native_oci_parity.py tests/test_research_daemon.py tests/test_adr18_benchmark_mode_separation.py
            src/rna_kernels/trajectory_zarr.py src/devbench/core/scrna_donor_trajectory.py)
          .venv/bin/ruff check "${files[@]}"
          .venv/bin/ruff format --check "${files[@]}"
          .venv/bin/mypy --follow-imports=silent src/devbench/mcp src/devbench/daemon src/devbench/engine/container_backend.py
      - name: Lint runnable RNA walkthroughs
        run: |
          "$GITHUB_WORKSPACE/.venv/bin/python" -m ruff check \
            "$GITHUB_WORKSPACE/examples/run_rna_demo.py" \
            "$GITHUB_WORKSPACE/examples/single-cell-rnaseq/run_kang_walkthrough.py"
          "$GITHUB_WORKSPACE/.venv/bin/python" -m ruff format --check \
            "$GITHUB_WORKSPACE/examples/run_rna_demo.py" \
            "$GITHUB_WORKSPACE/examples/single-cell-rnaseq/run_kang_walkthrough.py"
      - name: Verify expected architecture
        run: .venv/bin/python -c 'import platform; assert platform.machine() == ("arm64" if platform.system() == "Darwin" else "x86_64")'
      - name: Verify portable Workbench and source contracts
        run: |
          .venv/bin/python -m pytest -q \
            tests/test_agents_md.py \
            tests/test_workbench_redesign.py \
            tests/test_workbench_studio_thesis.py \
            tests/test_workbench_project_scope.py \
            tests/test_workbench_studio_drawer.py \
            tests/test_thesis_answerability_matrix.py \
            tests/test_source_bundle_verification.py
      - name: Verify pure-Python RNA solver behavior
        run: |
          .venv/bin/python -m pytest -q \
            tests/test_scientific_core_boundary.py \
            tests/test_scrna_ccc.py \
            tests/test_scrna_neighborhood_da.py \
            tests/test_bulk_deconvolution.py \
            tests/test_bulk_dtu.py \
            tests/test_spatial_analysis.py \
            tests/test_perturbation_analysis.py \
            tests/test_phenotype_prediction.py \
            tests/test_cross_arch_equivalence.py \
            tests/test_bulk_solver_routing.py
      - name: Verify daemon, protocol, privacy and complete installed plugin suite
        run: |
          .venv/bin/python integrations/codex/devharness/scripts/configure.py --mirror-clients all --mirror-root "$RUNNER_TEMP/mirrors"
          .venv/bin/python integrations/codex/devharness/scripts/configure.py --check-mirrors --mirror-root "$RUNNER_TEMP/mirrors"
          .venv/bin/python -m pytest -q tests/test_adr18_benchmark_mode_separation.py \
            tests/test_research_daemon.py tests/test_mcp_13_tool_control_plane.py \
            tests/test_mcp_conformance.py tests/test_mcp_resilience_recovery.py \
            tests/test_privacy_sentinel_leakage.py integrations/codex/tests/test_plugin.py
