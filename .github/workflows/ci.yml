name: Public software verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    name: ${{ matrix.os }} / Python 3.13
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    env:
      VECLIB_MAXIMUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.3'
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install locked environment
        run: uv sync --locked --extra dev --python 3.13
      - name: Verify expected architecture
        run: .venv/bin/python -c 'import platform; assert platform.machine() == ("arm64" if platform.system() == "Darwin" else "x86_64")'
      - name: Verify portable Workbench and source contracts
        run: |
          .venv/bin/python -m pytest -q \
            tests/test_workbench_redesign.py \
            tests/test_workbench_studio_thesis.py \
            tests/test_workbench_project_scope.py \
            tests/test_workbench_studio_drawer.py \
            tests/test_thesis_answerability_matrix.py \
            tests/test_source_bundle_verification.py
      # Configured plugin execution requires a separately verified patched SQLite runtime.
      - name: Verify plugin packaging and admission guards
        run: |
          .venv/bin/python -m pytest -q \
            integrations/codex/tests/test_plugin.py::test_manifest_and_inactive_template \
            integrations/codex/tests/test_plugin.py::test_workspace_scope_is_explicit \
            integrations/codex/tests/test_plugin.py::test_missing_runtime_preserves_destination \
            integrations/codex/tests/test_plugin.py::test_package_rejects_symlink_references \
            integrations/codex/tests/test_plugin.py::test_existing_destination_is_preserved \
            integrations/codex/tests/test_plugin.py::test_unpatched_runtime_is_refused_and_darwin_can_retry
