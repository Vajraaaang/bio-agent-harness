[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "devharness"
version = "0.5.0.dev0"
description = "Memory-supervised temporal transcriptomics tools and deterministic agent benchmarks"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
  "numpy>=1.24,<3",
  "pandas>=2,<3",
  "scipy>=1.11,<2",
  "scikit-learn>=1.3,<2",
  "statsmodels>=0.14,<0.15",
  "patsy>=0.5.6,<2",
  "zarr>=2.18,<3",
  "numcodecs>=0.12,<0.16",
  "h5py>=3.10,<4",
  "pydeseq2>=0.5.2,<0.6",
  "psutil>=5.9,<8",
  "mcp>=1.29.1,<2",
  "jsonschema>=4.20,<5",
  "certifi>=2024.2.2",
  "networkx>=3.2,<4",
  "pydantic>=2.10,<3",
  "cryptography>=44,<51",
  "PyNaCl>=1.6.2,<2",
  "tree-sitter==0.26.0",
  "tree-sitter-bash==0.25.1",
  "langgraph==1.2.12",
  "langchain-core==1.6.6",
  "langgraph-checkpoint-sqlite==3.1.1",
]

[project.optional-dependencies]
# Compatibility alias: the workflow runtime is also installed by the base project.
workflow = [
  "langgraph==1.2.12",
  "langchain-core==1.6.6",
  "langgraph-checkpoint-sqlite==3.1.1",
]
dev = ["pytest>=8,<10"]
reporting = ["matplotlib>=3.8,<4"]
analysis = [
  "anndata>=0.12,<0.13",
  "scanpy>=1.11,<2",
  "scvi-tools>=1.3,<2",
  "harmonypy>=0.0.10,<1",
  "igraph>=0.11,<2",
  "leidenalg>=0.10,<1",
  "umap-learn>=0.5,<1",
  "celltypist>=1.7,<2",
  "scrublet>=0.2,<1",
  "nbclient>=0.10,<1",
  "nbformat>=5.10,<6",
  "nbconvert>=7.16,<8",
  "plotly>=6,<7",
  "ipykernel>=6,<8",
]

[project.scripts]
devharness = "devharness_server.server:main"
devbench = "experiments.run_sweep:main"
devbench-metrics = "experiments.compile_metrics:main"
devharness-synthetic = "benchmarks.generate_synthetic:main"
devharness-ingest = "benchmarks.ingest_real_data:main"
devbench-audit = "devbench_engine.audit_cli:main"
devbench-report = "devbench_engine.visualizer:main"
devbench-live = "scripts.run_live_benchmark:main"
devbench-leaderboard = "scripts.make_leaderboard:main"
devharness-controlled = "devharness_controlled.cli:main"
devharness-verify-synthetic = "devharness_controlled.qualification:main"
devbench-study = "devbench.study.cli:main"
devbench-analyze = "devbench.analysis.workbench:main"
devbench-fastq-de = "devbench.analysis.fastq_cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["devharness*", "devbench*", "benchmarks*", "experiments*", "scripts*"]

[tool.setuptools.package-data]
benchmarks = ["task_definitions/*.json", "task_definitions/expanded/*.json", "reference_data/*.json", "reference_data/*.md"]
devbench_engine = ["AGENTS.md"]
devbench = ["tasks/catalog.json", "study/public_sources.json", "study/biology_catalog.json", "analysis/assets/workbench-ui.html", "analysis/assets/workbench-theme.css", "analysis/assets/workbench-conversation.js", "analysis/assets/workbench-investigations.js", "analysis/assets/workbench-artifacts.js", "analysis/assets/workbench-projects.js", "analysis/assets/workbench-synthetic.js", "analysis/assets/workbench-synthetic.css", "analysis/assets/scientific-figure.js", "analysis/assets/source-bundle.zip", "analysis/assets/community-workflow/*"]
devharness_controlled = ["native-package-sources.lock.json"]
devharness_server = ["r/*.R"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
