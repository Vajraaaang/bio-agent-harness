[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "devharness"
version = "0.5.0.dev0"
description = "Memory-supervised temporal transcriptomics tools and deterministic agent benchmarks"
readme = "README.md"
requires-python = ">=3.13"
license = {text = "MIT"}
dependencies = [
  "numpy>=1.24,<3",
  "pandas>=2,<3",
  "pyarrow==23.0.1",
  "scipy>=1.11,<2",
  "scikit-learn>=1.3,<2",
  "statsmodels>=0.14,<0.15",
  "patsy>=0.5.6,<2",
  "zarr>=2.18,<3",
  "numcodecs>=0.12,<0.16",
  "h5py>=3.10,<4",
  "pydeseq2>=0.5.2,<0.6",
  "psutil>=5.9,<8",
  "mcp>=1.29.1,<2",
  "jsonschema>=4.20,<5",
  "certifi>=2024.2.2",
  "networkx>=3.2,<4",
  "pydantic>=2.10,<3",
  "cryptography>=44,<51",
  "PyNaCl>=1.6.2,<2",
  "tree-sitter==0.26.0",
  "tree-sitter-bash==0.25.1",
  "langgraph==1.2.12",
  "langchain-core==1.6.6",
  "langgraph-checkpoint-sqlite==3.1.1",
]

[project.optional-dependencies]
# Compatibility alias: the workflow runtime is also installed by the base project.
workflow = [
  "langgraph==1.2.12",
  "langchain-core==1.6.6",
  "langgraph-checkpoint-sqlite==3.1.1",
]
dev = ["pytest>=8,<10", "tinycss2>=1.4,<2", "pypdf>=6.21.4,<7", "ruff==0.14.14", "mypy==1.19.1", "setuptools==84.0.0"]
reporting = ["matplotlib>=3.8,<4", "pypdf>=6.21.4,<7"]
analysis = [
  "anndata>=0.12,<0.13",
  "scanpy>=1.11,<2",
  "scvi-tools>=1.3,<2",
  "harmonypy>=0.0.10,<1",
  "igraph>=0.11,<2",
  "leidenalg>=0.10,<1",
  "umap-learn>=0.5,<1",
  "celltypist>=1.7,<2",
  "scrublet>=0.2,<1",
  "nbclient>=0.10,<1",
  "nbformat>=5.10,<6",
  "nbconvert>=7.16,<8",
  "plotly>=6,<7",
  "ipykernel>=6,<8",
]

[project.scripts]
devharness = "devharness_server.server:main"
devbench = "devbench.platform.cli:main"
devbench-metrics = "experiments.compile_metrics:main"
devharness-synthetic = "benchmarks.generate_synthetic:main"
devharness-ingest = "benchmarks.ingest_real_data:main"
devbench-audit = "devbench_engine.audit_cli:main"
devbench-report = "devbench_engine.visualizer:main"
devbench-live = "scripts.run_live_benchmark:main"
devbench-leaderboard = "scripts.make_leaderboard:main"
devharness-controlled = "devharness_controlled.cli:main"
devharness-verify-synthetic = "devharness_controlled.qualification:main"
devbench-study = "devbench.study.cli:main"
devbench-analyze = "devbench.analysis.workbench:main"
devbench-fastq-de = "devbench.analysis.fastq_cli:main"

[tool.setuptools.package-dir]
devbench = "src/devbench"

[tool.setuptools.packages.find]
where = ["src", "."]
namespaces = false
include = ["devharness*", "devbench*", "benchmarks*", "experiments*", "scripts*", "rna_kernels*"]

[tool.setuptools.package-data]
benchmarks = ["task_definitions/*.json", "task_definitions/expanded/*.json", "reference_data/*.json", "reference_data/*.md"]
devbench_engine = ["AGENTS.md"]
devbench = ["adaptive/*.py", "tasks/catalog.json", "study/public_sources.json", "study/biology_catalog.json", "analysis/assets/workbench-ui.html", "analysis/assets/workbench-theme.css", "analysis/assets/workbench-conversation.js", "analysis/assets/workbench-investigations.js", "analysis/assets/workbench-research.js", "analysis/assets/workbench-studio.js", "analysis/assets/workbench-context.js", "analysis/assets/workbench-lineage.js", "analysis/assets/workbench-qc.js", "analysis/assets/workbench-thesis-studio.js", "analysis/assets/workbench-studio.css", "analysis/assets/workbench-artifacts.js", "analysis/assets/workbench-projects.js", "analysis/assets/workbench-synthetic.js", "analysis/assets/workbench-synthetic.css", "analysis/assets/workbench-demo.js", "analysis/assets/workbench-summary-plots.js", "analysis/assets/workbench-demo.css", "analysis/assets/scientific-figure.js", "analysis/assets/bulk-scientific-figure.js", "analysis/assets/bulk-scientific-figure.css", "analysis/assets/scientific-palettes.js", "analysis/assets/scientific-plot-panels.js", "analysis/assets/scientific-plot-workbench.js", "analysis/assets/scientific-plot-verification.json", "analysis/assets/source-bundle.zip", "analysis/assets/community-workflow/*"]
"devbench.analysis" = [
  "assets/agentic-rna-v24-evaluation-protocol.md",
  "assets/2026-11-04-workbench-compute-contracts.schema.json",
  "assets/official-client-pins.json",
  "assets/owned-host-sentinel.txt",
]
devharness_controlled = ["native-package-sources.lock.json", "native-kernel-runtime.lock.json", "erql-package-sources.lock.json"]
devharness_server = ["r/*.R"]

[tool.ruff]
target-version = "py311"
extend-exclude = ["*grader*", "*grading*", "*golden*", "*private*", "*secret*", "*credential*"]

[tool.ruff.lint]
select = ["E", "F", "B", "I", "UP", "C90"]

[tool.mypy]
python_version = "3.13"
files = ["src/devbench", "devharness_core", "devharness_controlled", "devharness_server", "rna_kernels"]
exclude = ["(^|/)\\.[^/]+/", "(^|/)build/", "(?i)grader|grading|golden|private|secret|credential"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra --import-mode=importlib"
markers = ["wal: requires patched SQLite for scientific WAL; DEVBENCH_SKIP_UNPATCHED_WAL_TESTS=1 opts out on unpatched runtimes"]
