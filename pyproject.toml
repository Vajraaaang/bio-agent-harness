[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "devharness"
version = "0.4.17"
description = "Memory-supervised temporal transcriptomics tools and deterministic agent benchmarks"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
  "numpy>=1.24,<3", "pandas>=2,<3", "scipy>=1.11,<2",
  "scikit-learn>=1.3,<2", "statsmodels>=0.14,<0.15", "patsy>=0.5.6,<2",
  "zarr>=2.18,<3", "numcodecs>=0.12,<0.16", "h5py>=3.10,<4",
  "pydeseq2>=0.5.2,<0.6", "psutil>=5.9,<8", "mcp>=1.29.1,<2",
  "jsonschema>=4.20,<5", "certifi>=2024.2.2",
  "networkx>=3.2,<4",
  "pydantic>=2.10,<3", "cryptography>=44,<51", "PyNaCl>=1.6.2,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
devharness = "devharness_server.server:main"
devbench = "experiments.run_sweep:main"
devbench-metrics = "experiments.compile_metrics:main"
devharness-synthetic = "benchmarks.generate_synthetic:main"
devharness-ingest = "benchmarks.ingest_real_data:main"
devbench-audit = "devbench_engine.audit_cli:main"
devbench-report = "devbench_engine.visualizer:main"
devbench-live = "scripts.run_live_benchmark:main"
devbench-leaderboard = "scripts.make_leaderboard:main"
devharness-controlled = "devharness_controlled.cli:main"
devharness-verify-synthetic = "devharness_controlled.qualification:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["devharness*", "devbench*", "benchmarks*", "experiments*", "scripts*"]

[tool.setuptools.package-data]
benchmarks = ["task_definitions/*.json", "task_definitions/expanded/*.json", "reference_data/*.json", "reference_data/*.md"]
devbench_engine = ["AGENTS.md"]
devbench = ["tasks/catalog.json"]
devharness_controlled = ["native-package-sources.lock.json"]
devharness_server = ["r/*.R"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
